<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>

  <!-- 1. Meta refresh ส่งต่อทันที (delay 0 วินาที) -->
  <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbymlWR_bJ_DAY6m6sj9kgRwt26gGt04QscjifzeXZfU7FBp8o64iiosOz1iKJ_SmHHY/exec">

  <!-- 2. JavaScript redirect โดยใช้ replace เพื่อไม่ให้ติดประวัติหน้า redirect ในปุ่ม Back -->
  <script>
    window.location.replace("https://script.google.com/macros/s/AKfycbymlWR_bJ_DAY6m6sj9kgRwt26gGt04QscjifzeXZfU7FBp8o64iiosOz1iKJ_SmHHY/exec");
  </script>

  <style>
    body {
      background-color: #0f172a;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.25rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      color: #38bdf8;
      text-decoration: none;
      word-break: break-all;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>กำลังนำท่านไปยังระบบ...</p>
  <p style="font-size: 0.875rem;">
    หากระบบไม่เปลี่ยนหน้าอัตโนมัติ 
    <a href="https://script.google.com/macros/s/AKfycbymlWR_bJ_DAY6m6sj9kgRwt26gGt04QscjifzeXZfU7FBp8o64iiosOz1iKJ_SmHHY/exec">คลิกที่นี่</a>
  </p>
</body>
</html>
